<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rounds</title>
<meta name="theme-color" content="#0e141b">
<meta name="description" content="Personal account CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="brand"><img src="icons/icon-192.png" alt=""> Rounds</div>
    <a href="#/visits" data-tab="visits"><span class="ni" data-icon="checkCircle"></span><span>Visits</span></a>
    <a href="#/accounts" data-tab="accounts"><span class="ni" data-icon="store"></span><span>Accounts</span></a>
    <a href="#/priorities" data-tab="priorities"><span class="ni" data-icon="flag"></span><span>Priorities</span></a>
    <a href="#/products" data-tab="products"><span class="ni" data-icon="bottle"></span><span>Products</span></a>
    <a href="#/more" data-tab="more"><span class="ni" data-icon="dots"></span><span>More</span></a>
  </nav>
  <div id="main">
    <header id="topbar">
      <button id="back" class="icon-btn ghost" data-act="back" aria-label="Back" hidden></button>
      <h1 id="title">Rounds</h1>
      <div id="topActions"></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<button id="fab" data-act="fab" aria-label="Quick add"></button>
<div id="modals"></div>
<div id="toast" hidden></div>
<input type="file" id="fileImport" accept=".xlsx,.xls,.csv" hidden data-chg="fileImport">
<input type="file" id="fileRestore" accept=".json,application/json" hidden data-chg="fileRestore">
<script src="js/util.js"></script>
<script src="js/catalog.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/forms.js"></script>
<script src="js/io.js"></script>
<script src="js/main.js"></script>
</body>
</html>
